# Packages the Linux version (X11) as a .tar.gz. It is released on its own, apart from the Windows program (build.yml).
#
#   * Run it by hand: Actions tab -> Build (Linux) -> Run workflow. The archive is attached to the run as an artifact.
#   * Push a tag that starts with "linux-v" (for example linux-v1.2.0): the same build runs and a DRAFT release is created with the archive
#     and its SHA-256 checksum. It is never marked "latest", so the Windows download link and the Windows update check keep pointing at the
#     Windows release. Nothing is published until you open the draft on GitHub and press Publish (leave "Set as the latest release" unticked).
#
# The Linux version runs from source (Python), so the archive holds the program's files and the hash-pinned requirements; the README's
# "Linux" section says how to install them.
name: Build (Linux)

on:
  push:
    tags: ["linux-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock

      - name: Install requirements
        run: python -m pip install --require-hashes -r requirements-linux.lock

      - name: Run tests
        run: |
          python -m pip install --require-hashes --no-deps -r requirements-test.lock
          python -m pytest -q tests

      - name: Check the version matches the tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(python -c "from version import VERSION; print(VERSION)")
          if [ "$TAG" != "linux-v$v" ]; then echo "the tag $TAG does not match version.py ($v): update version.py before tagging"; exit 1; fi

      - name: Package
        id: pack
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; else version="linux-dev-$RUN_NUMBER"; fi
          name="InputOverlay_$version"
          # The program's files only: no Windows libraries, build script or Windows lock files, and no tests or promo pictures.
          git archive --format=tar.gz --prefix="InputOverlay/" -o "$name.tar.gz" HEAD -- \
            '*.py' ':!tests' overlay docs/THEMES.md docs/theme-template \
            requirements.txt requirements-linux.txt requirements-linux.lock requirements-constraints.txt \
            README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256.txt"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cat "$name.tar.gz.sha256.txt"

      # Unpacks the archive, starts the server from it and checks it serves its page and artwork. (There is no X display on the runner,
      # so keyboard and mouse capture keeps retrying in the background; the web server runs regardless.)
      - name: Smoke test
        run: |
          mkdir smoke && tar -xzf InputOverlay_*.tar.gz -C smoke
          export INPUT_OVERLAY_HOME="$RUNNER_TEMP/io-config"
          python smoke/InputOverlay/server.py --port 8799 > smoke.log 2>&1 &
          pid=$!
          sleep 8
          curl -fsS -o /dev/null http://127.0.0.1:8799/ || { cat smoke.log; exit 1; }
          curl -fsS -o /dev/null http://127.0.0.1:8799/img/ps5-controller.svg || { cat smoke.log; exit 1; }
          echo "server served its page and artwork"
          kill $pid

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            InputOverlay_*.tar.gz
            InputOverlay_*.tar.gz.sha256.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release
          merge-multiple: true

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" release/* --repo "$REPO" --draft --latest=false --title "$TAG (Linux)" --generate-notes
